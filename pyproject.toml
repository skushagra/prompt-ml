[project]
name = "prompt-ml"
version = "0.1.0"
description = "Prompt Machine Language — write LLM prompts as pure Python objects"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "openai>=2.45.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "openai>=1.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: tests that call the real OpenAI API (require OPENAI_API_KEY)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prompt_ml"]
